spring.application.name=backend
server.port=${PORT:8080}
server.address=0.0.0.0

# MySQL DataSource Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/openinfraiq?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Yashwanth@1}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# GitHub API Configuration (Kept server-side only)
github.token=${GITHUB_TOKEN:}

# CORS Configuration (Production Frontend URL, e.g. https://your-project.vercel.app)
frontend.url=${FRONTEND_URL:}

# Firebase Admin Configuration
# 1. Environment variables for Railway / Cloud deployment
firebase.project-id=${FIREBASE_PROJECT_ID:}
firebase.client-email=${FIREBASE_CLIENT_EMAIL:}
firebase.private-key=${FIREBASE_PRIVATE_KEY:}

# 2. File path fallback for local testing
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:}
